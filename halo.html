<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>halo</title>
<style>
  /* 알림 헤일로 링 창 (600×600, 마우스 통과). 펫 발 근처를 중심으로 3연타 파동 — pet.html의 sp-ripple 그대로 */
  * { margin:0; padding:0; } html, body { width:100%; height:100%; background:transparent; overflow:hidden; }
  #c { position:absolute; left:50%; top:50%; width:0; height:0; }
  #c i { position:absolute; left:0; top:0; width:104px; height:104px; margin:-52px 0 0 -52px; border-radius:50%; border:3.5px solid var(--halo,#5bb85c); opacity:0; }
  #c i:nth-child(1) { animation: ripple 2.1s ease-out infinite; }
  #c i:nth-child(2) { animation: ripple 2.1s ease-out infinite .16s; }
  #c i:nth-child(3) { animation: ripple 2.1s ease-out infinite .32s; }
  @keyframes ripple { 0% { opacity:.9; transform:scale(.28); } 6% { opacity:.85; } 40% { opacity:0; transform:scale(5.5); } 100% { opacity:0; transform:scale(5.5); } }
  body[data-kind="done"] { --halo:#5bb85c; } body[data-kind="wait"] { --halo:#e6952f; }
  @media (prefers-reduced-motion: reduce) { #c i { animation:none !important; opacity:.4; transform:scale(3.2); } }
</style></head>
<body><div id="c"><i></i><i></i><i></i></div>
<script>
  document.body.dataset.kind = new URLSearchParams(location.search).get('kind') || 'done';
  // 링 중심(창 안 좌표). 창이 화면 가장자리에서 안쪽으로 밀려 배치돼도 링은 펫 위에 오도록 메인이 보내준다
  const c = document.getElementById('c');
  if (window.pet && window.pet.onPetEvent) window.pet.onPetEvent((ev) => { if (ev && ev.type === 'center') { c.style.left = ev.x + 'px'; c.style.top = ev.y + 'px'; } });
</script>
</body></html>
